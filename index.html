<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Tarrasque-Dice/favicon.png" id="favicon" />
  <script>
    const favicon = document.getElementById('favicon');
    const isDark = window.matchMedia('(prefers-color-scheme: dark)');

    const updateFavicon = (e) => {
      favicon.href = e.matches ? '/favicon-light.png' : '/favicon.png';
    };

    // Initial check
    updateFavicon(isDark);

    // Listen for changes
    isDark.addEventListener('change', updateFavicon);
  </script>
